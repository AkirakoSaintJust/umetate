<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type P.fm1 — plugin GUI mockup</title>
<style>
  :root {
    --bg: #000000;
    --panel: #0a0a0a;
    --panel2: #0f0f0f;
    --line: #222222;
    --line2: #333333;
    --text: #e8e8e8;
    --dim: #7d7d7d;
    --faint: #4a4a4a;
    --pink: #ff2e7e;
    --pink2: #ff4d94;
    --purple: #c780ff;
    --select: #7ec8ff;
    --yellow: #ffe600;
    --white: #ffffff;
    --popup: #1e1e1e;
  }
  * { box-sizing: border-box; border-radius: 0; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #000;
    color: var(--text);
    font-family: "Fira Code", "Cascadia Code", "Cascadia Mono", ui-monospace, Consolas, monospace;
    font-size: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 26px; min-height: 100vh;
  }
  button, select { font-family: inherit; }

  .plugin {
    position: relative;
    width: 1240px; max-width: 100%;
    background: #000;
    border: 1px solid var(--line2);
    display: flex; flex-direction: column;
  }

  /* ---------------- header ---------------- */
  .hdr {
    display: flex; align-items: center; gap: 34px;
    padding: 14px 16px; background: #000;
    border-bottom: 1px solid var(--line2);
  }
  .brand { flex: 0 0 auto; padding-right: 22px; padding-bottom: 10px; }
  .logo {
    font-family: "Digital Desolation Plus", "Arial Black", Impact, sans-serif;
    font-weight: 900; font-size: 27px; line-height: 1;
    color: var(--white); letter-spacing: .02em;
    text-shadow: 9px 9px 0 var(--yellow);
  }
  .logo .dot { color: var(--pink); text-shadow: 9px 9px 0 var(--yellow); }

  .alg { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
  .alg-meta .lbl { font-size: 8px; letter-spacing: .2em; color: var(--dim); }
  .alg-meta .val { font-size: 30px; font-weight: 700; color: var(--pink); line-height: 1; }
  .alg-svg { width: 176px; height: 64px; }

  .out { flex: 1 1 auto; min-width: 180px; }
  .out-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .out-head .lbl { font-size: 8px; letter-spacing: .2em; color: var(--dim); }
  .seg { display: flex; gap: 0; }
  .seg button {
    background: #000; border: 1px solid var(--line2); color: var(--dim);
    font-size: 8px; letter-spacing: .12em; padding: 3px 8px; cursor: pointer;
  }
  .seg button + button { border-left: 0; }
  .seg button.active { color: var(--pink); border-color: var(--pink); }
  .out canvas { width: 100%; height: 50px; display: block; border: 1px solid var(--line); background: #000; }

  .actions { display: flex; gap: 8px; flex: 0 0 auto; align-items: stretch; }
  .btn {
    background: #000; border: 1px solid var(--line2); color: var(--text);
    font-size: 9px; letter-spacing: .1em; padding: 8px 10px; cursor: pointer;
    display: flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--pink); }
  .btn .k { color: var(--faint); font-size: 8px; letter-spacing: .14em; }
  .btn.part { padding: 0; }
  .btn.part .plabel { padding: 8px 8px; }
  .btn.part .caret { padding: 8px 7px; border-left: 1px solid var(--line2); color: var(--dim); }
  .btn.part .caret:hover { color: var(--pink); }
  .btn.part.active { border-color: var(--pink); }
  .btn.part.active .plabel { color: var(--pink); }
  .btn.part.active .caret { color: var(--pink); border-left-color: var(--pink); }

  /* ---------------- tabs ---------------- */
  .tabs { display: flex; gap: 0; padding: 0; background: #000; border-bottom: 1px solid var(--line2); }
  .tab {
    background: #000; border: 0; border-right: 1px solid var(--line);
    color: var(--dim); font-size: 9px; letter-spacing: .16em; font-weight: 700;
    padding: 12px 18px; cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: #000; background: var(--pink); }

  /* ---------------- body ---------------- */
  .body { padding: 14px 16px 16px; min-height: 470px; }
  .grid { display: grid; gap: 10px; }

  .card { background: var(--panel); border: 1px solid var(--line); padding: 10px; min-width: 0; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card h3 { margin: 0; font-size: 8px; letter-spacing: .18em; color: var(--pink); font-weight: 700; text-transform: uppercase; }
  .sec-actions { display: flex; gap: 3px; }
  button.mini {
    background: #000; border: 1px solid var(--line2); color: var(--dim);
    font-size: 7px; letter-spacing: .1em; padding: 2px 5px; cursor: pointer;
  }
  button.mini:hover:not(:disabled) { color: var(--pink); border-color: var(--pink); }
  button.mini:disabled { opacity: .3; cursor: default; }

  .knobs { display: flex; flex-wrap: wrap; gap: 8px 4px; }
  .knob { width: 52px; text-align: center; user-select: none; }
  .dial { width: 42px; height: 42px; margin: 0 auto 3px; cursor: ns-resize; touch-action: none; }
  .dial svg { width: 42px; height: 42px; display: block; }
  .dial .track { fill: none; stroke: #2a2a2a; stroke-width: 3; }
  .dial .arc { fill: none; stroke: var(--pink); stroke-width: 3; }
  .dial .ptr { stroke: var(--white); stroke-width: 2; }
  .knob-name { font-size: 7.5px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
  .knob-val { font-size: 10px; font-weight: 700; color: var(--pink2); font-variant-numeric: tabular-nums; }
  .knob:hover .knob-name { color: var(--text); }

  .inline { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .inline .lbl { font-size: 8px; letter-spacing: .14em; color: var(--dim); }
  select.sel {
    background: #000; color: var(--text); border: 1px solid var(--line2);
    padding: 4px 20px 4px 7px; font-size: 9px; outline: none;
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='5'%3E%3Cpath d='M0 0l4.5 4.5L9 0' fill='none' stroke='%237d7d7d' stroke-width='1.4'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 5px center;
  }
  select.sel:focus { border-color: var(--pink); }

  .toggle { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .toggle .trk { width: 24px; height: 12px; background: #1a1a1a; border: 1px solid var(--line2); position: relative; }
  .toggle .thb { position: absolute; top: 1px; left: 1px; width: 8px; height: 8px; background: var(--faint); }
  .toggle.on .trk { border-color: var(--pink); }
  .toggle.on .thb { left: 13px; background: var(--pink); }
  .toggle .tname { font-size: 8px; letter-spacing: .12em; color: var(--dim); }
  .toggle.on .tname { color: var(--pink); }

  .envbox { height: 62px; border: 1px solid var(--line); background: #000; margin-bottom: 8px; }
  .envbox svg { width: 100%; height: 100%; display: block; }
  .envbox .egrid { stroke: #1a1a1a; stroke-width: 1; }
  .envbox .ecurve { fill: none; stroke: var(--purple); stroke-width: 1.4; }
  .envbox .ecurve2 { fill: none; stroke: var(--pink); stroke-width: 1.4; }

  /* ---------------- operators ---------------- */
  .ops-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .opcol { border: 1px solid var(--line2); background: #000; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .opcol-head { display: flex; align-items: center; justify-content: space-between; }
  .opname { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--white); }
  .op-name.car, .opname.car { color: var(--pink); }
  .opvis { display: flex; gap: 6px; }
  .opvis canvas { width: 50%; height: 40px; display: block; border: 1px solid var(--line); background: #000; }

  /* ---------------- home ---------------- */
  .opcards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .opcard { border: 1px solid var(--line2); background: #000; padding: 9px; cursor: pointer; }
  .opcard:hover { border-color: var(--pink); }
  .opcard .ch { display: flex; justify-content: space-between; align-items: center; }
  .opcard .on { font-size: 12px; font-weight: 700; letter-spacing: .12em; }
  .opcard .role { font-size: 7px; letter-spacing: .14em; padding: 1px 5px; }
  .role.mod { background: var(--white); color: #000; }
  .role.car { background: var(--pink); color: #000; }
  .opcard .mini { height: 30px; margin-top: 7px; }
  .opcard .meta { font-size: 8px; color: var(--dim); letter-spacing: .04em; margin-top: 5px; }
  .opcard .mini canvas { width: 100%; height: 100%; display: block; }

  .home-low { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }
  .analyser { height: 150px; border: 1px solid var(--line); background: #000; }
  .analyser canvas { width: 100%; height: 100%; display: block; }

  .parts { display: flex; gap: 10px; }
  .part { flex: 1; border: 1px solid var(--line2); background: #000; padding: 8px 10px; }
  .part .ph { display: flex; justify-content: space-between; align-items: baseline; }
  .part .pn { font-size: 9px; letter-spacing: .14em; color: var(--select); font-weight: 700; }
  .part .pv { font-size: 8px; color: var(--dim); }
  .part .bar { height: 3px; background: #1a1a1a; margin-top: 7px; }
  .part .bar i { display: block; height: 100%; background: var(--pink); }

  /* ---------------- fx / mod / glo ---------------- */
  .fx-grid, .mod-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: start; }
  .glo-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }
  table.parts-tbl { width: 100%; border-collapse: collapse; font-size: 9px; }
  table.parts-tbl th { text-align: left; font-size: 7px; letter-spacing: .16em; color: var(--faint); padding: 0 8px 7px; text-transform: uppercase; }
  table.parts-tbl td { padding: 6px 8px; border-top: 1px solid var(--line); }
  table.parts-tbl td.mono { color: var(--pink2); font-variant-numeric: tabular-nums; }
  table.parts-tbl td.dim { color: var(--dim); }
  table.parts-tbl tr.active td:first-child { color: var(--select); font-weight: 700; }

  /* ---------------- status strip ---------------- */
  .status { display: flex; align-items: center; justify-content: space-between;
    padding: 7px 16px; background: #000; border-top: 1px solid var(--line2); }
  .status .leds { display: flex; gap: 14px; align-items: center; font-size: 8px; letter-spacing: .14em; color: var(--dim); }
  .led { width: 6px; height: 6px; background: var(--faint); display: inline-block; }
  .led.on { background: var(--pink); }
  .status .rt { font-size: 8px; letter-spacing: .14em; color: var(--faint); }

  .mocktag { font-size: 8px; letter-spacing: .2em; color: var(--faint); }

  /* ---------------- popovers / dialogs ---------------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center; z-index: 30;
  }
  .dialog { width: 420px; max-width: 92vw; background: var(--popup); border: 1px solid var(--line2); }
  .dialog-head { padding: 12px 14px; border-bottom: 1px solid #2e2e2e; font-size: 9px; letter-spacing: .16em; color: var(--white); font-weight: 700; display:flex; justify-content:space-between; }
  .dialog-head .x { cursor: pointer; color: #999; font-size: 11px; letter-spacing: 0; }
  .dialog-head .x:hover { color: var(--pink); }
  .dialog-body { padding: 14px; color: var(--white); font-size: 10px; line-height: 1.7; }
  .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 14px; border-top: 1px solid #2e2e2e; }
  .dialog-foot button {
    background: #242424; border: 1px solid #3a3a3a; color: var(--white);
    font-size: 9px; letter-spacing: .12em; padding: 6px 14px; cursor: pointer;
  }
  .dialog-foot button.primary { border-color: var(--pink); color: var(--pink); background: #000; }
  .dialog-foot button:hover { filter: brightness(1.2); }

  .part-menu {
    position: absolute; z-index: 25; width: 190px;
    background: var(--popup); border: 1px solid var(--line2);
    box-shadow: 0 16px 40px rgba(0,0,0,.8);
  }
  .part-menu .pm-head { padding: 8px 10px; border-bottom: 1px solid #2e2e2e; font-size: 8px; letter-spacing: .16em; color: var(--dim); }
  .part-menu button {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; border-bottom: 1px solid #262626;
    color: var(--white); font-size: 9px; letter-spacing: .1em; padding: 9px 10px; cursor: pointer;
  }
  .part-menu button:hover { background: #262626; color: var(--pink); }

  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .slots .slot {
    background: #000; border: 1px solid #3a3a3a; color: var(--white);
    font-size: 12px; padding: 14px 0; cursor: pointer; letter-spacing: .1em;
  }
  .slots .slot:hover { border-color: var(--purple); }
  .slots .slot.sel { border-color: var(--purple); color: var(--purple); background: rgba(199,128,255,.08); }
  .note { margin-top: 10px; color: #9a9a9a; font-size: 9px; letter-spacing: .04em; }

  .preset-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; cursor: pointer; border-left: 2px solid transparent; }
  .preset-row:hover { background: #262626; }
  .preset-row.sel { background: rgba(199,128,255,.14); border-left-color: var(--purple); }
  .preset-row .tag { color: var(--pink); font-size: 8px; margin-left: 8px; letter-spacing: .1em; }
  .preset-row .meta { color: #9a9a9a; font-size: 8px; letter-spacing: .1em; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--popup); border: 1px solid var(--pink); color: var(--white);
    font-size: 9px; letter-spacing: .12em; padding: 8px 16px; z-index: 40;
  }
</style>
</head>
<body>
<div class="plugin" id="plugin">
  <header class="hdr">
    <div class="brand"><div class="logo">TYPE P<span class="dot">.</span>fm1</div></div>

    <div class="alg">
      <div class="alg-meta">
        <div class="lbl">ALGORITHM</div>
        <div class="val" id="algVal">4</div>
      </div>
      <svg class="alg-svg" viewBox="0 0 176 64" aria-hidden="true" id="hdrAlg"></svg>
    </div>

    <div class="out">
      <div class="out-head">
        <span class="lbl">OUTPUT</span>
        <div class="seg" id="visSeg">
          <button data-mode="scope" class="active">SCOPE</button>
          <button data-mode="spectro">SPECTRO</button>
        </div>
      </div>
      <canvas id="scope" width="360" height="50"></canvas>
    </div>

    <div class="actions">
      <button class="btn patch" id="patchBtn"><span class="k">PATCH</span><span id="patchName">INIT PATCH</span></button>
      <button class="btn part active" data-part="1"><span class="plabel">P1</span><span class="caret">&#9662;</span></button>
      <button class="btn part" data-part="2"><span class="plabel">P2</span><span class="caret">&#9662;</span></button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main class="body" id="body"></main>

  <div class="status">
    <div class="leds"><span class="led on"></span>MIDI <span class="led on"></span>SYNC</div>
    <div class="rt" id="statusPart">PART 1 ACTIVE</div>
  </div>
</div>

<div class="mocktag">MOCKUP &middot; DESIGN ONLY</div>

<script>
  "use strict";

  /* ---------------- knob ---------------- */
  const A0 = 135, SWEEP = 270;
  function angleFor(f) { return A0 + SWEEP * f; }
  function pt(cx, cy, r, deg) {
    const a = deg * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }
  function arc(cx, cy, r, f0, f1) {
    const a0 = angleFor(f0), a1 = angleFor(f1);
    const p0 = pt(cx, cy, r, a0), p1 = pt(cx, cy, r, a1);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return "M " + p0[0].toFixed(2) + " " + p0[1].toFixed(2) +
      " A " + r + " " + r + " 0 " + large + " 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2);
  }
  function fmtVal(s) { return s.fmt ? s.fmt(s.val) : Math.round(s.val); }

  function makeKnob(spec) {
    const el = document.createElement("div");
    el.className = "knob";
    const dial = document.createElement("div");
    dial.className = "dial";
    dial.innerHTML =
      '<svg viewBox="0 0 42 42">' +
      '<path class="track" d="' + arc(21, 21, 16, 0, 1) + '"/>' +
      '<path class="arc" d="' + arc(21, 21, 16, 0, 0.0001) + '"/>' +
      '<line class="ptr" x1="21" y1="21" x2="21" y2="21"/>' +
      "</svg>";
    const name = document.createElement("div");
    name.className = "knob-name"; name.textContent = spec.name;
    const val = document.createElement("div");
    val.className = "knob-val";
    el.append(dial, name, val);
    el.__spec = spec; el.__dial = dial;
    refreshKnob(el);

    dial.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      dial.setPointerCapture(e.pointerId);
      const startY = e.clientY, startVal = spec.val;
      const rng = spec.max - spec.min;
      const step = spec.step != null ? spec.step : (rng > 30 ? 1 : 0.01);
      function move(ev) {
        const scale = ev.shiftKey ? 0.12 : 1;
        let v = startVal + (startY - ev.clientY) / 160 * rng * scale;
        v = Math.max(spec.min, Math.min(spec.max, v));
        spec.val = Math.round(v / step) * step;
        refreshKnob(el);
        if (spec.onChange) spec.onChange(spec.val);
      }
      function up() {
        dial.removeEventListener("pointermove", move);
        dial.removeEventListener("pointerup", up);
      }
      dial.addEventListener("pointermove", move);
      dial.addEventListener("pointerup", up);
    });
    return el;
  }

  function refreshKnob(el) {
    const s = el.__spec;
    const frac = (s.val - s.min) / (s.max - s.min);
    const svg = el.__dial.querySelector("svg");
    svg.querySelector(".arc").setAttribute("d", arc(21, 21, 16, 0, Math.max(frac, 0.0001)));
    const p = pt(21, 21, 15, angleFor(frac));
    const q = pt(21, 21, 6, angleFor(frac));
    const line = svg.querySelector(".ptr");
    line.setAttribute("x1", q[0].toFixed(2)); line.setAttribute("y1", q[1].toFixed(2));
    line.setAttribute("x2", p[0].toFixed(2)); line.setAttribute("y2", p[1].toFixed(2));
    el.querySelector(".knob-val").textContent = fmtVal(s);
  }

  function makeSelect(options, current, onchange) {
    const sel = document.createElement("select");
    sel.className = "sel";
    options.forEach(function (o) {
      const opt = document.createElement("option");
      opt.value = o; opt.textContent = o;
      if (o === current) opt.selected = true;
      sel.appendChild(opt);
    });
    if (onchange) sel.addEventListener("change", function () { onchange(sel.value); });
    return sel;
  }

  function makeToggle(name, on, onchange) {
    const el = document.createElement("div");
    el.className = "toggle" + (on ? " on" : "");
    el.innerHTML = '<div class="trk"><div class="thb"></div></div><div class="tname">' + name + "</div>";
    el.addEventListener("click", function () {
      el.classList.toggle("on");
      if (onchange) onchange(el.classList.contains("on"));
    });
    return el;
  }

  /* ---------------- data ---------------- */
  const OPS = [
    { name: "O1", role: "car", ratio: 1.0, detune: 0, level: 99, fb: 0, wave: "sine", r: [99, 40, 30, 60], l: [99, 70, 0], lfoRate: 5.0, lfoDepth: 0, mute: false },
    { name: "O2", role: "mod", ratio: 2.0, detune: 0, level: 0, fb: 0, wave: "sine", r: [99, 45, 35, 60], l: [0, 0, 0], lfoRate: 5.0, lfoDepth: 0, mute: false },
    { name: "O3", role: "car", ratio: 1.0, detune: 0, level: 0, fb: 0, wave: "sine", r: [99, 40, 30, 60], l: [0, 0, 0], lfoRate: 5.0, lfoDepth: 0, mute: false },
    { name: "O4", role: "mod", ratio: 3.0, detune: 0, level: 0, fb: 0, wave: "sine", r: [99, 40, 30, 60], l: [0, 0, 0], lfoRate: 5.0, lfoDepth: 0, mute: false }
  ];
  const WAVES = ["sine", "triangle", "half sine", "half tri", "2x sine", "2x tri",
    "2x half sine", "2x half tri", "rect sine", "pulse", "square", "saw"];

  let clipboard = null;
  let current = "home";
  let activePart = 1;
  let visMode = "scope";

  function b(obj, key, name, min, max, fmt) {
    return { name: name, min: min, max: max, fmt: fmt, get: function () { return obj[key]; }, set: function (v) { obj[key] = v; } };
  }
  function ba(obj, arr, i, name, min, max, fmt) {
    return { name: name, min: min, max: max, fmt: fmt,
      get: function () { return obj[arr][i]; }, set: function (v) { obj[arr][i] = v; } };
  }

  function makeSection(title, kind, bindings, opts) {
    opts = opts || {};
    const card = document.createElement("div");
    card.className = "card";
    const head = document.createElement("div");
    head.className = "sec-head";
    const h = document.createElement("h3");
    h.textContent = title;
    head.appendChild(h);
    if (opts.copy !== false) {
      const acts = document.createElement("div");
      acts.className = "sec-actions";
      const cpy = document.createElement("button");
      cpy.className = "mini"; cpy.textContent = "COPY";
      cpy.addEventListener("click", function () {
        clipboard = { kind: kind, values: bindings.map(function (x) { return x.get(); }) };
        rerender();
      });
      const pst = document.createElement("button");
      pst.className = "mini"; pst.textContent = "PASTE";
      pst.disabled = !(clipboard && clipboard.kind === kind);
      pst.addEventListener("click", function () {
        if (clipboard && clipboard.kind === kind) {
          bindings.forEach(function (x, i) { x.set(clipboard.values[i]); });
          rerender();
        }
      });
      acts.append(cpy, pst);
      head.appendChild(acts);
    }
    card.appendChild(head);
    if (opts.before) card.appendChild(opts.before);
    const kn = document.createElement("div");
    kn.className = "knobs";
    bindings.forEach(function (x) {
      kn.appendChild(makeKnob({ name: x.name, min: x.min, max: x.max, val: x.get(), fmt: x.fmt, onChange: x.set }));
    });
    card.appendChild(kn);
    if (opts.after) card.appendChild(opts.after);
    return card;
  }

  /* ---------------- visualisers ---------------- */
  function drawScope(cv, seed, t, amp) {
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.beginPath();
    const f = 3 + (Math.round(seed * 10) % 5);
    for (let x = 0; x <= W; x++) {
      const p = x / W;
      const y = H / 2 + Math.sin(p * Math.PI * f + t + seed) * amp * H * Math.sin(p * Math.PI);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "#ff2e7e";
    ctx.lineWidth = 1.3;
    ctx.stroke();
  }
  function drawSpectro(cv, seed, t, scale) {
    scale = scale == null ? 1 : scale;
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const n = 22, bw = W / n;
    for (let i = 0; i < n; i++) {
      const v = Math.max(0.04, 0.5 + 0.5 * Math.sin(i * 0.7 + seed * 1.3 + t * 2.1) * Math.cos(i * 0.31 + seed + t));
      const h = v * (H - 2) * scale;
      ctx.fillStyle = (i % 5 === 0) ? "#c780ff" : "#ff2e7e";
      ctx.fillRect(i * bw + 1, H - h, bw - 2, h);
    }
  }

  let t = 0;
  function tick() {
    const hcv = document.getElementById("scope");
    if (hcv) { if (visMode === "scope") drawScope(hcv, 1.1, t, 0.34); else drawSpectro(hcv, 1.1, t); }
    const acv = document.getElementById("analyser");
    if (acv) { if (visMode === "scope") drawScope(acv, 2.1, t, 0.42); else drawSpectro(acv, 2.1, t); }
    document.querySelectorAll(".oscope").forEach(function (cv, i) {
      drawScope(cv, 1 + i * 0.6, t * 1.1, 0.42 * (+(cv.dataset.level || 99) / 99));
    });
    document.querySelectorAll(".ospectro").forEach(function (cv, i) {
      drawSpectro(cv, 1.4 + i * 0.8, t, +(cv.dataset.level || 99) / 99);
    });
    document.querySelectorAll(".opmini").forEach(function (cv, i) {
      drawScope(cv, 1 + i * 0.7, t, 0.4 * (+(cv.dataset.level || 99) / 99));
    });
    t += 0.05;
    requestAnimationFrame(tick);
  }

  function envSvg(r, l) {
    const W = 240, H = 62;
    const widths = r.map(function (rr) { return 8 + (99 - rr) / 99 * 26; });
    const total = widths.reduce(function (a, b) { return a + b; }, 0);
    const scale = (W - 12) / total;
    let x = 6, d = "M 6 " + H;
    const lv = [l[0], l[1], l[2], l[2]];
    for (let i = 0; i < 4; i++) {
      x += widths[i] * scale;
      const y = H - 3 - lv[i] / 99 * (H - 10);
      d += " L " + x.toFixed(1) + " " + y.toFixed(1);
    }
    x += widths[3] * scale;
    d += " L " + x.toFixed(1) + " " + H;
    return '<svg viewBox="0 0 ' + W + " " + H + '">' +
      '<line class="egrid" x1="6" y1="' + (H - 3) + '" x2="' + (W - 6) + '" y2="' + (H - 3) + '"/>' +
      '<path class="ecurve" d="' + d + '"/></svg>';
  }

    }
    bodyEl.appendChild(grid);
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = "Pick a target slot, then SAVE.";
    bodyEl.appendChild(note);
    openDialog("SAVE PART " + p + " TO SLOT", bodyEl, [
      { label: "CANCEL", onClick: function (close) { close(); } },
      { label: "SAVE", primary: true, onClick: function (close) { close(); openSaveConfirm(p, sel + 1); } }
    ]);
  }

  function openSaveConfirm(p, slot) {
    const bodyEl = document.createElement("div");
    bodyEl.innerHTML = "Save <b>PART " + p + "</b> to slot <b>" + String(slot).padStart(2, "0") +
      "</b>?<br><span style='color:#9a9a9a'>This overwrites the slot.</span>";
    openDialog("CONFIRM SAVE", bodyEl, [
      { label: "CANCEL", onClick: function (close) { close(); } },
      { label: "SAVE", primary: true, onClick: function (close) { close(); toast("PART " + p + " SAVED TO SLOT " + String(slot).padStart(2, "0")); } }
    ]);
  }

  function openInitConfirm(p) {
    const bodyEl = document.createElement("div");
    bodyEl.innerHTML = "Initialise <b>PART " + p + "</b>?<br><span style='color:#9a9a9a'>" +
      "This clears the current part. Unsaved work will be lost.</span>";
    openDialog("INIT PART " + p, bodyEl, [
      { label: "CANCEL", onClick: function (close) { close(); } },
      { label: "CONTINUE", primary: true, onClick: function (close) { close(); toast("PART " + p + " INITIALISED"); } }
    ]);
  }

  /* ---------------- presets (patch button) ---------------- */
  const PRESETS = [
    ["INIT PATCH", "default"], ["BRASS PAD", "part 1"], ["GLASS BELL", "part 1"],
    ["SUB BASS", "part 1"], ["E.PIANO 84", "part 1"], ["CLANG BELL", "part 2"],
    ["ORGAN PAD", "part 2"], ["HARSH LEAD", "part 2"]
  ];
  const patchName = document.getElementById("patchName");

  document.getElementById("patchBtn").addEventListener("click", function () {
    let sel = 0;
    const bodyEl = document.createElement("div");
    const list = document.createElement("div");
    function render() {
      list.innerHTML = "";
      PRESETS.forEach(function (p, i) {
        const r = document.createElement("div");
        r.className = "preset-row" + (i === sel ? " sel" : "");
        r.innerHTML = "<span>" + p[0] + (p[0] === patchName.textContent ? '<span class="tag">ACTIVE</span>' : "") +
          '</span><span class="meta">' + p[1] + "</span>";
        r.addEventListener("click", function () { sel = i; render(); });
        list.appendChild(r);
      });
    }
    render();
    bodyEl.appendChild(list);
    openDialog("PRESETS", bodyEl, [
      { label: "CANCEL", onClick: function (close) { close(); } },
      { label: "LOAD", primary: true, onClick: function (close) { patchName.textContent = PRESETS[sel][0]; close(); } }
    ]);
  });

  /* ---------------- init ---------------- */
  document.getElementById("hdrAlg").innerHTML = algDiagram();
  tick();

  function fromHash() {
    const h = (location.hash || "").replace("#", "");
    if (h === "presets") { showTab("home"); document.getElementById("patchBtn").click(); return; }
    if (h === "save") { showTab("home"); openSlotPicker(1); return; }
    if (h === "init") { showTab("home"); openInitConfirm(1); return; }
    if (h === "menu") { showTab("home"); openPartMenu(1, document.querySelector('.btn.part[data-part="1"]')); return; }
    if (TABS.some(function (x) { return x.id === h; })) showTab(h);
    else showTab("home");
  }
  window.addEventListener("hashchange", fromHash);
  fromHash();
</script>
</body>
</html>
