<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type P.fm1 — plugin GUI mockup</title>
<!-- Zen Dots and DotGothic16, SIL Open Font License. Bundle the woff2 files in the real plugin build. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Dots&display=swap">
<noscript><link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Dots&display=swap" rel="stylesheet"></noscript>
<style>
  :root {
    --bg: #000000;
    --panel: #070707;
    --panel2: #0c0c0c;
    --line: #1c1c1c;
    --line2: #2e2e2e;
    --text: #d2d2d2;
    --dim: #7d7d7d;
    --faint: #4a4a4a;
    --pink: #ff2e7e;
    --pink2: #ff4d94;
    --purple: #c780ff;
    --green: #3dff9e;
    --green2: #9dffcd;
    --select: #7ec8ff;
    --yellow: #ffe600;
    --white: #ffffff;
    --popup: #1b1b1b;
    --font-ui: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Cascadia Mono", ui-monospace, monospace;
    --font-head: "Zen Dots", "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", ui-monospace, monospace;
  }
  * { box-sizing: border-box; border-radius: 0; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #000;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 16px;
    letter-spacing: .02em;
    text-transform: lowercase;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 26px; min-height: 100vh;
  }
  button, select, input { font-family: inherit; letter-spacing: inherit; text-transform: inherit; }
  input { text-transform: none; }

  .plugin {
    position: relative;
    width: 1240px; max-width: 100%;
    background: #000;
    border: 1px solid var(--line2);
    display: flex; flex-direction: column;
  }
  .plugin::before, .plugin::after {
    content: ""; position: absolute; width: 11px; height: 11px; pointer-events: none;
  }
  .plugin::before { top: -1px; left: -1px; border-top: 2px solid var(--pink); border-left: 2px solid var(--pink); }
  .plugin::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--pink); border-right: 2px solid var(--pink); }

  /* ---------------- header ---------------- */
  .hdr {
    display: flex; align-items: center; gap: 28px;
    padding: 14px 16px; background: #000;
    border-bottom: 1px solid var(--line2);
  }
  .brand { flex: 0 0 auto; padding-right: 14px; padding-bottom: 10px; }
  .logo {
    font-family: "Digital Desolation Plus", "Arial Black", Impact, sans-serif;
    font-weight: 900; font-size: 30px; line-height: 1;
    color: #d6d6d6; letter-spacing: .02em; text-transform: none;
    text-shadow: 4px 4px 0 #c2ad00;
  }
  .logo .dot { color: var(--pink); text-shadow: 4px 4px 0 #c2ad00; }
  .brand-sub {
    margin-top: 7px; font-family: var(--font-ui); font-size: 9px;
    letter-spacing: .06em; color: var(--dim); white-space: nowrap;
  }

  .alg { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; cursor: pointer; }
  .alg:hover .val { color: var(--pink2); }
  .alg-meta .lbl { font-family: var(--font-head); font-size: 10px; letter-spacing: .12em; color: var(--dim); }
  .alg-meta .val { font-family: var(--font-head); font-size: 30px; color: var(--pink); line-height: 1; }
  .alg-meta .caret { font-family: var(--font-ui); font-size: 12px; color: var(--faint); margin-left: 3px; vertical-align: middle; }
  .alg-svg { width: 244px; height: 130px; }

  .out { flex: 1 1 auto; min-width: 180px; }
  .out-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .out-head .lbl { font-family: var(--font-head); font-size: 10px; letter-spacing: .12em; color: var(--green); }
  .seg { display: flex; gap: 0; }
  .seg button {
    background: #000; border: 1px solid var(--line2); color: var(--dim);
    font-size: 8px; letter-spacing: .12em; padding: 3px 8px; cursor: pointer;
  }
  .seg button + button { border-left: 0; }
  .seg button.active { color: var(--purple); border-color: var(--purple); }
  .out canvas { width: 100%; height: 50px; display: block; background: #000; }

  .actions { display: flex; gap: 8px; flex: 0 0 auto; align-items: stretch; }
  .btn {
    background: #000; border: 1px solid var(--line2); color: var(--text);
    font-size: 12px; letter-spacing: .02em; padding: 8px 10px; cursor: pointer;
    display: flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--pink); }
  .btn .k { color: var(--faint); font-size: 11px; letter-spacing: .03em; }
  .btn.renamer { color: var(--dim); }
  .btn.renamer:hover { color: var(--pink); }

  /* ---------------- toolbar ---------------- */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 16px; background: #000; border-bottom: 1px solid var(--line2);
  }
  .legend { display: flex; align-items: center; gap: 6px; padding-right: 6px; border-right: 1px solid var(--line2); }
  .legend .lbl { font-size: 11px; color: var(--faint); margin-right: 8px; }
  .sq {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; font-size: 12px; line-height: 1;
  }
  .sq.active { background: var(--pink); color: #000; border: 1px solid var(--pink); }
  .sq.muted { background: #000; color: var(--pink); border: 1px solid var(--pink); }
  .mutebox {
    min-width: 36px; height: 22px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-ui); font-size: 13px; line-height: 1; cursor: pointer;
    background: var(--pink); color: #000; border: 1px solid var(--pink); padding: 0 4px;
  }
  .mutebox.muted { background: #000; color: var(--pink); }
  .mutebox:hover { border-color: var(--pink2); }
  .tgroup { display: flex; align-items: center; gap: 6px; }
  .tlabel { font-family: var(--font-head); font-size: 9px; letter-spacing: .1em; color: var(--faint); margin-right: 3px; }
  .tdiv { width: 1px; height: 26px; background: var(--line2); margin: 0 6px; }
  .tbtn {
    background: #000; border: 1px solid var(--line2); color: var(--dim);
    font-size: 12px; letter-spacing: .02em; padding: 5px 8px; cursor: pointer;
  }
  .tbtn:hover { border-color: var(--pink); color: var(--text); }
  .tbtn.partsel { padding: 5px 11px; }
  .tbtn.partsel.active { border-color: var(--green); color: var(--green); }
  .tbtn.pmenu { padding: 5px 9px; }

  /* ---------------- tabs ---------------- */
  .tabs { display: flex; gap: 0; padding: 0; background: #000; border-bottom: 1px solid var(--line2); }
  .tab {
    background: #000; border: 0;
    color: var(--dim); font-family: var(--font-head); font-size: 12px; letter-spacing: .03em;
    padding: 11px 16px; cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: #000; background: var(--pink);
    clip-path: polygon(5px 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 7px) 100%, 0 100%, 5px 50%);
  }

  /* ---------------- body ---------------- */
  .body { padding: 14px 16px 16px; min-height: 624px; }
  .grid { display: grid; gap: 10px; }

  .card { background: var(--panel); padding: 9px; min-width: 0; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
  .card h3 { margin: 0; font-family: var(--font-head); font-size: 11px; letter-spacing: .08em; color: var(--pink); font-weight: 400; }
  .card h3::before, .vmode h3::before { content: "// "; color: var(--faint); }
  .sec-actions { display: flex; gap: 3px; }
  button.mini {
    background: #000; border: 1px solid var(--line2); color: var(--dim);
    font-size: 12px; letter-spacing: .02em; padding: 2px 6px; cursor: pointer;
  }
  button.mini:hover:not(:disabled) { color: var(--pink); border-color: var(--pink); }
  button.mini:disabled { opacity: .3; cursor: default; }
  button.mini.muted { background: var(--pink); border-color: var(--pink); color: #000; }

  .knobs { display: flex; flex-wrap: wrap; gap: 8px 4px; }
  .knob { width: 52px; text-align: center; user-select: none; }
  .dial { width: 42px; height: 42px; margin: 0 auto 3px; cursor: ns-resize; touch-action: none; }
  .dial svg { width: 42px; height: 42px; display: block; }
  .dial .track { fill: none; stroke: #2a2a2a; stroke-width: 3; }
  .dial .arc { fill: none; stroke: var(--pink); stroke-width: 3; }
  .dial .ptr { stroke: var(--white); stroke-width: 2; }
  .knob-name { font-size: 13px; letter-spacing: .01em; color: var(--dim); }
  .knob-val { font-size: 16px; color: var(--pink2); font-variant-numeric: tabular-nums; cursor: text; }
  .knob-val:hover { color: var(--white); text-decoration: underline; text-underline-offset: 2px; }
  .knob-input {
    width: 64px; background: #000; border: 1px solid var(--green); color: var(--green);
    font-family: inherit; font-size: 15px; font-weight: 700; text-align: center;
    padding: 0; outline: none; font-variant-numeric: tabular-nums;
  }
  .knob:hover .knob-name { color: var(--text); }

  .inline { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .inline .lbl { font-size: 13px; letter-spacing: .04em; color: var(--dim); }
  select.sel {
    background: #000; color: var(--text); border: 1px solid var(--line2);
    padding: 4px 20px 4px 7px; font-size: 9px; outline: none;
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='9' height='5'%3E%3Cpath d='M0 0l4.5 4.5L9 0' fill='none' stroke='%237d7d7d' stroke-width='1.4'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 5px center;
  }
  select.sel:focus { border-color: var(--pink); }

  .toggle { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .toggle .trk { width: 26px; height: 12px; background: #1a1a1a; border: 1px solid var(--line2); position: relative; }
  .toggle .thb { position: absolute; top: 1px; left: 1px; width: 10px; height: 8px; background: var(--faint); }
  .toggle.on .trk { border-color: var(--green); }
  .toggle.on .thb { left: 14px; background: var(--green); }
  .toggle .tname { font-size: 11px; letter-spacing: .04em; color: var(--dim); }
  .toggle.on .tname { color: var(--green); }

  .toggle.mute .trk { border-color: var(--pink); }
  .toggle.mute .thb { left: 1px; background: var(--pink); }
  .toggle.mute .tname { font-size: 11px; letter-spacing: .02em; color: var(--faint); }
  .toggle.mute:not(.muted) .tname.l { color: var(--pink); }
  .toggle.mute.muted .tname.r { color: var(--pink); }
  .toggle.mute.muted .trk { border-color: var(--line2); }
  .toggle.mute.muted .thb { left: 14px; background: #3a3a3a; }
  .toggle.mute:hover .trk { border-color: var(--pink2); }

  .envbox { height: 62px; background: #000; margin-bottom: 8px; }
  .envbox svg { width: 100%; height: 100%; display: block; }
  .envbox .egrid { stroke: #1a1a1a; stroke-width: 1; }
  .envbox .ecurve { fill: none; stroke: var(--purple); stroke-width: 1.4; }
  .envbox .ecurve2 { fill: none; stroke: var(--green); stroke-width: 1.4; }
  .envbox .ezero { stroke: #3a3a3a; stroke-width: 1; stroke-dasharray: 2 3; }

  /* ---------------- operators ---------------- */
  .ops-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .opcol { background: #000; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .opcol .card { padding: 8px; }
  .opcol .knobs { gap: 5px 0; }
  .opcol .knob { width: 36px; }
  .opcol .osc .knob, .opcol .amplfo .knob { width: 56px; }
  .opcol .osc .knobs { gap: 6px 0; justify-content: space-between; }
  .opcol .amplfo .knobs { gap: 6px 24px; }
  .opcol .env .knob { width: 37px; }
  .opcol .dial, .opcol .dial svg { width: 34px; height: 34px; }
  .opcol .envbox { height: 52px; margin-bottom: 6px; }
  .opcol-head { display: flex; align-items: center; justify-content: space-between; }
  .opname { font-family: var(--font-head); font-size: 14px; letter-spacing: .05em; color: var(--white); }
  .op-name.car, .opname.car { color: var(--pink); }
  .opvis { display: flex; gap: 6px; }
  .opvis canvas { width: 50%; height: 40px; display: block; background: #000; }

  .patchpage { display: flex; flex-direction: column; gap: 10px; min-height: 594px; }
  .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
  .part .pvis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; min-height: 120px; margin-top: 10px; }
  .part .pcell { display: flex; flex-direction: column; gap: 3px; min-height: 0; }
  .part .pcell canvas { flex: 1; width: 100%; min-height: 0; display: block; }
  .part { border: 1px solid transparent; background: #000; padding: 8px 10px 10px; display: flex; flex-direction: column; }
  .part.active { border-color: var(--green); }
  .part .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .part .pn { font-family: var(--font-head); font-size: 12px; letter-spacing: .04em; color: var(--dim); }
  .part.active .pn { color: var(--green); }
  .part .pacts { display: flex; gap: 4px; align-items: center; }
  .part .knobs { gap: 6px 2px; }
  .part .knob { width: 62px; }
  .part .dial, .part .dial svg { width: 38px; height: 38px; }
  .lvl { margin-top: 10px; }
  .lvlcap { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; letter-spacing: .04em; color: var(--dim); margin-bottom: 4px; }
  .lvlval { color: var(--pink2); }
  .lvltrack { height: 14px; background: #111; border: 1px solid var(--line2); position: relative; cursor: ew-resize; touch-action: none; }
  .lvltrack i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--purple); }

  .vmode { background: #000; padding: 8px 10px; }
  .vmode h3 { margin: 0; font-family: var(--font-head); font-size: 11px; letter-spacing: .06em; color: var(--pink); font-weight: 400; }
  .vmode .vh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .vmode .vrow { display: flex; align-items: center; gap: 10px; }
  .vmode .vbtns { display: flex; }
  .vmode .vbtns button {
    background: #000; border: 1px solid var(--line2); color: var(--dim);
    font-size: 11px; letter-spacing: .06em; padding: 5px 9px; cursor: pointer;
  }
  .vmode .vbtns button + button { border-left: 0; }
  .vmode .vbtns button.active { background: var(--green); border-color: var(--green); color: #000; font-weight: 700; }
  .vmode .knobs { gap: 6px 2px; flex: 1; justify-content: flex-end; }

  /* ---------------- fx / mod ---------------- */
  .fxmod-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr 1fr; gap: 10px; min-height: 594px;
  }
  .fxmod-grid .card { display: flex; flex-direction: column; }
  .fxmod-grid .span2 { grid-column: span 2; }
  .kvcols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; flex: 1; }
  .kvcol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kvcol.off { opacity: .45; }
  .kvhead { font-family: var(--font-head); font-size: 11px; letter-spacing: .06em; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
  .kvcol .knob { width: 64px; }
  .penvcard .knobs { gap: 6px 4px; }
  .penvcard .knob { width: 52px; }
  .penvcard .dial, .penvcard .dial svg { width: 38px; height: 38px; }

  /* ---------------- status strip ---------------- */
  .status { display: flex; align-items: center; justify-content: flex-start;
    padding: 7px 16px; background: #000; border-top: 1px solid var(--line2); }
  .status .leds { display: flex; gap: 14px; align-items: center; font-family: var(--font-head); font-size: 11px; letter-spacing: .06em; color: var(--dim); }
  .led { width: 6px; height: 6px; background: var(--faint); display: inline-block; }
  .led.on { background: var(--green); }

  .mocktag { font-size: 8px; letter-spacing: .2em; color: var(--faint); }

  /* ---------------- popovers / dialogs ---------------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center; z-index: 30;
  }
  .dialog { width: 420px; max-width: 92vw; background: var(--popup); border: 1px solid var(--line2); }
  .dialog.wide { width: 780px; }
  .dialog-head { padding: 12px 14px; border-bottom: 1px solid #2e2e2e; font-family: var(--font-head); font-size: 11px; letter-spacing: .06em; color: var(--white); display:flex; justify-content:space-between; }
  .dialog-head .x { cursor: pointer; color: #999; font-size: 11px; letter-spacing: 0; }
  .dialog-head .x:hover { color: var(--pink); }
  .dialog-body { padding: 14px; color: var(--white); font-size: 14px; line-height: 1.6; }
  .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 14px; border-top: 1px solid #2e2e2e; }
  .dialog-foot button {
    background: #242424; border: 1px solid #3a3a3a; color: var(--white);
    font-size: 9px; letter-spacing: .12em; padding: 6px 14px; cursor: pointer;
  }
  .dialog-foot button.primary { border-color: var(--pink); color: var(--pink); background: #000; }
  .dialog-foot button:hover { filter: brightness(1.2); }

  .part-menu {
    position: absolute; z-index: 25; width: 190px;
    background: var(--popup); border: 1px solid var(--line2);
    box-shadow: 0 16px 40px rgba(0,0,0,.8);
  }
  .part-menu .pm-head { padding: 8px 10px; border-bottom: 1px solid #2e2e2e; font-size: 11px; letter-spacing: .08em; color: var(--dim); }
  .part-menu button {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; border-bottom: 1px solid #262626;
    color: var(--white); font-size: 12px; letter-spacing: .04em; padding: 9px 10px; cursor: pointer;
  }
  .part-menu button:hover:not(:disabled) { background: #262626; color: var(--pink); }
  .part-menu button:disabled { color: #555; cursor: default; }

  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .slots .slot {
    background: #000; border: 1px solid #3a3a3a; color: var(--white);
    font-size: 15px; padding: 10px 0 8px; cursor: pointer; letter-spacing: .08em;
  }
  .slots .slot .sname { display: block; margin-top: 4px; font-size: 12px; letter-spacing: 0; color: var(--dim); }
  .slots .slot.sel .sname { color: var(--purple); }
  .slots .slot.dead { opacity: .3; cursor: default; }
  .slots .slot:hover:not(:disabled) { border-color: var(--purple); }
  .slots .slot.sel { border-color: var(--purple); color: var(--purple); background: rgba(199,128,255,.08); }
  .patchlist {
    max-height: 260px; overflow-y: auto; scrollbar-width: thin;
    scrollbar-color: var(--pink) #000;
  }
  .partlist {
    display: flex; flex-direction: column; max-height: 240px; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--pink) #000;
  }
  .slotrow {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: #000; border: 1px solid transparent; border-bottom: 1px dashed #222;
    color: var(--text); font-size: 15px; padding: 8px 10px; cursor: pointer;
  }
  .slotrow:hover:not(:disabled) { border-color: var(--purple); color: var(--purple); }
  .slotrow.sel { border-color: var(--purple); color: var(--purple); background: rgba(199,128,255,.08); }
  .slotrow .pno { color: var(--faint); min-width: 26px; }
  .slotrow .sname { flex: 1; }
  .slotrow.sel .sname { color: var(--purple); }
  .slotrow.dead { opacity: .35; cursor: default; }
  .patchlist::-webkit-scrollbar, .partlist::-webkit-scrollbar { width: 8px; }
  .patchlist::-webkit-scrollbar-track, .partlist::-webkit-scrollbar-track { background: #000; }
  .patchlist::-webkit-scrollbar-thumb, .partlist::-webkit-scrollbar-thumb { background: var(--line2); }
  .patchlist::-webkit-scrollbar-thumb:hover, .partlist::-webkit-scrollbar-thumb:hover { background: var(--pink); }
  .textin {
    width: 100%; background: #000; border: 1px solid var(--line2); color: var(--white);
    font-size: 14px; padding: 8px 10px; outline: none;
  }
  .textin:focus { border-color: var(--green); }
  .alg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .alg-tile { border: 1px solid var(--line2); background: #000; padding: 6px 6px 4px; cursor: pointer; }
  .alg-tile:hover { border-color: var(--pink); }
  .alg-tile.sel { border-color: var(--green); background: rgba(61,255,158,.05); }
  .alg-tile svg { width: 100%; height: auto; display: block; }
  .alg-tile .an { margin-top: 3px; text-align: center; font-size: 11px; letter-spacing: .1em; color: var(--dim); }
  .alg-tile.sel .an { color: var(--green); }
  .note { margin-top: 10px; color: #9a9a9a; font-size: 13px; letter-spacing: .02em; }

  .preset-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 10px; cursor: pointer; border-left: 2px solid transparent; }
  .preset-row:hover { background: #262626; }
  .preset-row.sel { background: rgba(199,128,255,.14); border-left-color: var(--purple); }

<script>
  "use strict";

  /* ---------------- knob ---------------- */
  const A0 = 135, SWEEP = 270;
  function angleFor(f) { return A0 + SWEEP * f; }
  function pt(cx, cy, r, deg) {
    const a = deg * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }
  function arc(cx, cy, r, f0, f1) {
    const a0 = angleFor(f0), a1 = angleFor(f1);
    const p0 = pt(cx, cy, r, a0), p1 = pt(cx, cy, r, a1);
    const large = (a1 - a0) > 180 ? 1 : 0;
    return "M " + p0[0].toFixed(2) + " " + p0[1].toFixed(2) +
      " A " + r + " " + r + " 0 " + large + " 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2);
  }
  function fmtVal(s) { return s.fmt ? s.fmt(s.val) : Math.round(s.val); }

  function makeKnob(spec) {
    const el = document.createElement("div");
    el.className = "knob";
    const dial = document.createElement("div");
    dial.className = "dial";
    dial.innerHTML =
      '<svg viewBox="0 0 42 42">' +
      '<path class="track" d="' + arc(21, 21, 16, 0, 1) + '"/>' +
      '<path class="arc" d="' + arc(21, 21, 16, 0, 0.0001) + '"/>' +
      '<line class="ptr" x1="21" y1="21" x2="21" y2="21"/>' +
      "</svg>";
    const name = document.createElement("div");
    name.className = "knob-name"; name.textContent = spec.name;
    const val = document.createElement("div");
    val.className = "knob-val";
    el.append(dial, name, val);
    el.__spec = spec; el.__dial = dial;
    refreshKnob(el);

    function stepFor() {
      return spec.step != null ? spec.step : ((spec.max - spec.min) > 30 ? 1 : 0.01);
    }

    val.title = "Click to type a value";
    val.addEventListener("click", function () { editValue(); });

    function editValue() {
      if (val.querySelector("input")) return;
      const input = document.createElement("input");
      input.className = "knob-input";
      input.type = "text";
      input.value = String(spec.val);
      val.textContent = "";
      val.appendChild(input);
      input.focus();
      input.select();
      let done = false;
      function finish(commit) {
        if (done) return;
        done = true;
        if (commit) {
          const n = parseFloat(input.value);
          if (isFinite(n)) {
            const step = stepFor();
            let v = Math.max(spec.min, Math.min(spec.max, n));
            v = Math.round(v / step) * step;
            spec.val = +v.toFixed(6);
            if (spec.onChange) spec.onChange(spec.val);
          }
        }
        refreshKnob(el);
      }
      input.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
        else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
      });
      input.addEventListener("blur", function () { finish(true); });
    }

    dial.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      dial.setPointerCapture(e.pointerId);
      const startY = e.clientY, startVal = spec.val;
      const rng = spec.max - spec.min;
      const step = stepFor();
      function move(ev) {
        const scale = ev.shiftKey ? 0.12 : 1;
        let v = startVal + (startY - ev.clientY) / 160 * rng * scale;
        v = Math.max(spec.min, Math.min(spec.max, v));
        spec.val = Math.round(v / step) * step;
        refreshKnob(el);
        if (spec.onChange) spec.onChange(spec.val);
      }
      function up() {
        dial.removeEventListener("pointermove", move);
        dial.removeEventListener("pointerup", up);
      }
      dial.addEventListener("pointermove", move);
      dial.addEventListener("pointerup", up);
    });
    return el;
  }

  function refreshKnob(el) {
    const s = el.__spec;
    const frac = (s.val - s.min) / (s.max - s.min);
    const svg = el.__dial.querySelector("svg");
    svg.querySelector(".arc").setAttribute("d", arc(21, 21, 16, 0, Math.max(frac, 0.0001)));
    const p = pt(21, 21, 15, angleFor(frac));
    const q = pt(21, 21, 6, angleFor(frac));
    const line = svg.querySelector(".ptr");
    line.setAttribute("x1", q[0].toFixed(2)); line.setAttribute("y1", q[1].toFixed(2));
    line.setAttribute("x2", p[0].toFixed(2)); line.setAttribute("y2", p[1].toFixed(2));
    el.querySelector(".knob-val").textContent = fmtVal(s);
  }

  function makeSelect(options, current, onchange) {
    const sel = document.createElement("select");
    sel.className = "sel";
    options.forEach(function (o) {
      const opt = document.createElement("option");
      opt.value = o; opt.textContent = o;
      if (o === current) opt.selected = true;
      sel.appendChild(opt);
    });
    if (onchange) sel.addEventListener("change", function () { onchange(sel.value); });
    return sel;
  }

  function makeToggle(name, on, onchange) {
    const el = document.createElement("div");
    el.className = "toggle" + (on ? " on" : "");
    el.innerHTML = '<div class="trk"><div class="thb"></div></div><div class="tname">' + name + "</div>";
    el.addEventListener("click", function () {
      el.classList.toggle("on");
      if (onchange) onchange(el.classList.contains("on"));
    });
    return el;
  }

  function makeMuteSwitch(muted, onchange) {
    const el = document.createElement("div");
    el.className = "toggle mute" + (muted ? " muted" : "");
    el.innerHTML = '<span class="tname l">active</span><div class="trk"><div class="thb"></div></div><span class="tname r">mute</span>';
    el.addEventListener("click", function () {
      const nowMuted = !el.classList.contains("muted");
      el.classList.toggle("muted", nowMuted);
      if (onchange) onchange(nowMuted);
    });
    return el;
  }

  /* ---------------- data ---------------- */
  const OPS = [
    { name: "op1", role: "car", ratio: 1.0, detune: 0, level: 99, fb: 0, wave: "sine", r: [99, 40, 30, 60], l: [99, 70, 0], lfoRate: 5.0, lfoDepth: 0, lfoWave: "sine", mute: false },
    { name: "op2", role: "mod", ratio: 2.0, detune: 0, level: 0, fb: 0, wave: "sine", r: [99, 45, 35, 60], l: [0, 0, 0], lfoRate: 5.0, lfoDepth: 0, lfoWave: "sine", mute: false },
    { name: "op3", role: "car", ratio: 1.0, detune: 0, level: 0, fb: 0, wave: "sine", r: [99, 40, 30, 60], l: [0, 0, 0], lfoRate: 5.0, lfoDepth: 0, lfoWave: "sine", mute: false },
    { name: "op4", role: "mod", ratio: 3.0, detune: 0, level: 0, fb: 0, wave: "sine", r: [99, 40, 30, 60], l: [0, 0, 0], lfoRate: 5.0, lfoDepth: 0, lfoWave: "sine", mute: false }
  ];
  const WAVES = ["sine", "triangle", "half sine", "half tri", "2x sine", "2x tri",
    "2x half sine", "2x half tri", "rect sine", "pulse", "square", "saw"];
  const LFO_WAVES = ["sine", "triangle", "saw", "inverse saw", "square", "random"];
  const PARTS = [
    { name: "init", midi: 1, low: 0, high: 127, level: 99, delay: 0, mute: false },
    { name: "init", midi: 2, low: 0, high: 127, level: 99, delay: 0, mute: false }
  ];
  const PART_SLOTS = [null, null, null, null, null, null, null, null];
  const PITCH_LFO = { rate: 0, depth: 0, wave: "sine" };
  const PITCH_ENV = { on: false, r: [80, 60, 50, 80], l: [2, -1, 0] };
  const FILTER_ENV = { r: [99, 50, 40, 60], l: [99, 40, 0] };
  const KEY_FOLLOW = {
    bp: 60,
    sel: 0,
    targets: [
      { name: "op1 level", lo: 0, hi: 0 },
      { name: "op1 feedback", lo: 0, hi: 0 },
      { name: "op1 amp env", lo: 0, hi: 0 },
      { name: "op2 level", lo: 0, hi: 0 },
      { name: "op2 feedback", lo: 0, hi: 0 },
      { name: "op2 amp env", lo: 0, hi: 0 },
      { name: "op3 level", lo: 0, hi: 0 },
      { name: "op3 feedback", lo: 0, hi: 0 },
      { name: "op3 amp env", lo: 0, hi: 0 },
      { name: "op4 level", lo: 0, hi: 0 },
      { name: "op4 feedback", lo: 0, hi: 0 },
      { name: "op4 amp env", lo: 0, hi: 0 },
      { name: "pitch env", lo: 0, hi: 0 },
      { name: "filter 1 cutoff", lo: 0, hi: 0 },
      { name: "filter 2 cutoff", lo: 0, hi: 0 },
      { name: "filter env", lo: 0, hi: 0 }
    ]
  };
  const VEL_FOLLOW = {
    on: true,
    sel: 0,
    targets: [
      { name: "op1 level", amount: 0 },
      { name: "op1 feedback", amount: 0 },
      { name: "op1 amp env", amount: 0 },
      { name: "op2 level", amount: 0 },
      { name: "op2 feedback", amount: 0 },
      { name: "op2 amp env", amount: 0 },
      { name: "op3 level", amount: 0 },
      { name: "op3 feedback", amount: 0 },
      { name: "op3 amp env", amount: 0 },
      { name: "op4 level", amount: 0 },
      { name: "op4 feedback", amount: 0 },
      { name: "op4 amp env", amount: 0 },
      { name: "pitch env", amount: 0 },
      { name: "filter 1 cutoff", amount: 0 },
      { name: "filter env", amount: 0 }
    ]
  };
  const VOICE = { mode: "poly", unison: 1, detune: 0, porta: 0 };

  let clipboard = null;
  let current = "patch";
  let activePart = 1;
  let visMode = "scope";
  let ALG = 4;
  let loadedSlot = 0;

  function b(obj, key, name, min, max, fmt, step) {
    return { name: name, min: min, max: max, fmt: fmt, step: step,
      get: function () { return obj[key]; }, set: function (v) { obj[key] = v; } };
  }
  function ba(obj, arr, i, name, min, max, fmt, step) {
    return { name: name, min: min, max: max, fmt: fmt, step: step,
      get: function () { return obj[arr][i]; }, set: function (v) { obj[arr][i] = v; } };
  }

  function knobRow(bindings) {
    const kn = document.createElement("div");
    kn.className = "knobs";
    bindings.forEach(function (x) {
      kn.appendChild(makeKnob({ name: x.name, min: x.min, max: x.max, val: x.get(), fmt: x.fmt, step: x.step, onChange: x.set }));
    });
    return kn;
  }

  function makeSection(title, kind, bindings, opts) {    opts = opts || {};
    const card = document.createElement("div");
    card.className = "card";
    const head = document.createElement("div");
    head.className = "sec-head";
    const h = document.createElement("h3");
    h.textContent = title;
    head.appendChild(h);
    if (opts.copy !== false) {
      const acts = document.createElement("div");
      acts.className = "sec-actions";
      const cpy = document.createElement("button");
      cpy.className = "mini"; cpy.textContent = "COPY";
      cpy.addEventListener("click", function () {
        clipboard = { kind: kind, values: bindings.map(function (x) { return x.get(); }) };
        rerender();
      });
      const pst = document.createElement("button");
      pst.className = "mini"; pst.textContent = "PASTE";
      pst.disabled = !(clipboard && clipboard.kind === kind);
      pst.addEventListener("click", function () {
        if (clipboard && clipboard.kind === kind) {
          bindings.forEach(function (x, i) { x.set(clipboard.values[i]); });
          rerender();
        }
      });
      acts.append(cpy, pst);
      head.appendChild(acts);
    }
    if (opts.headExtra) head.appendChild(opts.headExtra);
    card.appendChild(head);
    if (opts.before) card.appendChild(opts.before);
    card.appendChild(knobRow(bindings));
    if (opts.after) card.appendChild(opts.after);
    return card;
  }

  /* ---------------- visualisers ---------------- */
  function drawScope(cv, seed, t, amp) {
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.beginPath();
    const f = 3 + (Math.round(seed * 10) % 5);
    for (let x = 0; x <= W; x++) {
      const p = x / W;
      const y = H / 2 + Math.sin(p * Math.PI * f + t + seed) * amp * H * Math.sin(p * Math.PI);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "#3dff9e";
    ctx.lineWidth = 1.3;
    ctx.stroke();
  }
  function drawSpectro(cv, seed, t, scale) {
    scale = scale == null ? 1 : scale;
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const n = 22, bw = W / n;
    for (let i = 0; i < n; i++) {
      const v = Math.max(0.04, 0.5 + 0.5 * Math.sin(i * 0.7 + seed * 1.3 + t * 2.1) * Math.cos(i * 0.31 + seed + t));
      const h = v * (H - 2) * scale;
      ctx.fillStyle = (i % 5 === 0) ? "#c780ff" : "#ff2e7e";
      ctx.fillRect(i * bw + 1, H - h, bw - 2, h);
    }
  }

  let t = 0;
  function tick() {
    const hcv = document.getElementById("scope");
    if (hcv) { if (visMode === "scope") drawScope(hcv, 1.1, t, 0.34); else drawSpectro(hcv, 1.1, t); }
    document.querySelectorAll(".oscope").forEach(function (cv, i) {
      drawScope(cv, 1 + i * 0.6, t * 1.1, 0.42 * (+(cv.dataset.level || 99) / 99));
    });
    document.querySelectorAll(".ospectro").forEach(function (cv, i) {
      drawSpectro(cv, 1.4 + i * 0.8, t, +(cv.dataset.level || 99) / 99);
    });
    document.querySelectorAll(".opmini").forEach(function (cv, i) {
      drawScope(cv, 1 + i * 0.7, t, 0.4 * (+(cv.dataset.level || 99) / 99));
    });
    document.querySelectorAll(".pscope").forEach(function (cv, i) {
      drawScope(cv, 2.2 + i * 0.6, t * 0.9, 0.36 * (+cv.dataset.level / 99));
    });
    document.querySelectorAll(".pspectro").forEach(function (cv, i) {
      drawSpectro(cv, 2.6 + i * 0.8, t, +cv.dataset.level / 99);
    });
    t += 0.05;
    requestAnimationFrame(tick);
  }

  function envSvg(r, l, cls) {
    const W = 240, H = 62;
    const widths = r.map(function (rr) { return 8 + (99 - rr) / 99 * 26; });
    const total = widths.reduce(function (a, b) { return a + b; }, 0);
    const scale = (W - 12) / total;
    let x = 6, d = "M 6 " + H;
    const lv = [l[0], l[1], l[2], l[2]];
    for (let i = 0; i < 4; i++) {
      x += widths[i] * scale;
      const y = H - 3 - lv[i] / 99 * (H - 10);
      d += " L " + x.toFixed(1) + " " + y.toFixed(1);
    }
    x += widths[3] * scale;
    d += " L " + x.toFixed(1) + " " + H;
    return '<svg viewBox="0 0 ' + W + " " + H + '">' +
      '<line class="egrid" x1="6" y1="' + (H - 3) + '" x2="' + (W - 6) + '" y2="' + (H - 3) + '"/>' +
      '<path class="' + (cls || "ecurve") + '" d="' + d + '"/></svg>';
  }

  function noteName(n) {
    const names = ["c", "c#", "d", "d#", "e", "f", "f#", "g", "g#", "a", "a#", "b"];
    return names[n % 12] + (Math.floor(n / 12) - 1);
  }
  function notePair(n) { return n + "/" + noteName(n); }
  function bipFmt(v) { return (v > 0 ? "+" : "") + v + "%"; }

  function penvSvg(r, l) {
    const W = 240, H = 62, mid = H / 2;
    const widths = r.map(function (rr) { return 8 + (99 - rr) / 99 * 26; });
    const total = widths.reduce(function (a, b) { return a + b; }, 0);
    const scale = (W - 12) / total;
    let x = 6, d = "M 6 " + mid;
    [l[0], l[1], l[2], 0].forEach(function (lev, i) {
      x += widths[i] * scale;
      const y = mid - lev / 12 * (mid - 5);
      d += " L " + x.toFixed(1) + " " + y.toFixed(1);
    });
    return '<svg viewBox="0 0 ' + W + " " + H + '">' +
      '<line class="ezero" x1="6" y1="' + mid + '" x2="' + (W - 6) + '" y2="' + mid + '"/>' +
      '<path class="ecurve" d="' + d + '"/></svg>';
  }

  /* alg diagrams: white = modulator, pink = carrier */
  const ALG_LAYOUT = [
    { pos: [[60, 6], [60, 34], [60, 62], [60, 90]], edges: [[0, 1], [1, 2], [2, 3]], car: [3] },
    { pos: [[18, 6], [92, 6], [55, 44], [55, 82]], edges: [[0, 2], [1, 2], [2, 3]], car: [3] },
    { pos: [[16, 6], [96, 6], [96, 44], [56, 82]], edges: [[1, 2], [0, 3], [2, 3]], car: [3] },
    { pos: [[80, 6], [22, 46], [138, 46], [80, 86]], edges: [[0, 1], [0, 2], [1, 3], [2, 3]], car: [3] },
    { pos: [[32, 10], [32, 50], [108, 10], [108, 50]], edges: [[0, 1], [2, 3]], car: [1, 3] },
    { pos: [[80, 8], [10, 58], [80, 58], [150, 58]], edges: [[0, 1], [0, 2], [0, 3]], car: [1, 2, 3] },
    { pos: [[24, 8], [24, 58], [90, 58], [156, 58]], edges: [[0, 1]], car: [1, 2, 3] },
    { pos: [[16, 38], [66, 38], [116, 38], [166, 38]], edges: [], car: [0, 1, 2, 3] }
  ];
  const OPW = 36, OPH = 18;

  function wire(x1, y1, x2, y2) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    const bx = x2 - 4.4 * Math.cos(a), by = y2 - 4.4 * Math.sin(a);
    const p1x = x2 - 5.8 * Math.cos(a) + 2.4 * Math.sin(a);
    const p1y = y2 - 5.8 * Math.sin(a) - 2.4 * Math.cos(a);
    const p2x = x2 - 5.8 * Math.cos(a) - 2.4 * Math.sin(a);
    const p2y = y2 - 5.8 * Math.sin(a) + 2.4 * Math.cos(a);
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + bx.toFixed(1) + '" y2="' + by.toFixed(1) +
      '" stroke="#666" stroke-width="1.2"/>' +
      '<polygon points="' + x2 + "," + y2 + " " + p1x.toFixed(1) + "," + p1y.toFixed(1) + " " +
      p2x.toFixed(1) + "," + p2y.toFixed(1) + '" fill="#666"/>';
  }

  function arrowDown(x, y, len) {
    return '<line x1="' + x + '" y1="' + y + '" x2="' + x + '" y2="' + (y + len - 4) +
      '" stroke="#c780ff" stroke-width="1.6"/>' +
      '<polygon points="' + x + "," + (y + len) + " " + (x - 3.2) + "," + (y + len - 4) + " " +
      (x + 3.2) + "," + (y + len - 4) + '" fill="#c780ff"/>';
  }

  function algSvg(n) {
    const L = ALG_LAYOUT[n] || ALG_LAYOUT[0];
    let g = "";
    L.edges.forEach(function (e) {
      const a = L.pos[e[0]], b = L.pos[e[1]];
      g += wire(a[0] + OPW / 2, a[1] + OPH, b[0] + OPW / 2, b[1]);
    });
    L.pos.forEach(function (p, i) {
      const isCar = L.car.indexOf(i) >= 0;
      g += '<rect x="' + p[0] + '" y="' + p[1] + '" width="' + OPW + '" height="' + OPH + '" fill="' +
        (isCar ? "#ff2e7e" : "#ffffff") + '"/>' +
        '<text x="' + (p[0] + OPW / 2) + '" y="' + (p[1] + 12.5) + '" fill="#000" font-size="9" font-weight="700" ' +
        'text-anchor="middle" font-family="DotGothic16, monospace">op' + (i + 1) + "</text>";
      if (isCar) g += arrowDown(p[0] + OPW / 2, p[1] + OPH + 1, 12);
    });
    return '<svg viewBox="0 0 240 128" preserveAspectRatio="xMidYMid meet">' + g + "</svg>";
  }

  function renderAlg() {
    document.getElementById("algVal").textContent = ALG;
    document.getElementById("hdrAlg").innerHTML = algSvg(ALG);
  }

  function setAlg(n) {
    ALG = n;
    renderAlg();
  }

  function openAlgPicker() {
    let sel = ALG;
    const bodyEl = document.createElement("div");
    const grid = document.createElement("div");
    grid.className = "alg-grid";
    const tiles = [];
    for (let i = 0; i < 8; i++) {
      const tile = document.createElement("div");
      tile.className = "alg-tile" + (i === sel ? " sel" : "");

  function makeLevelSlider(obj, key, label) {
    const el = document.createElement("div");
    el.className = "lvl";
    const cap = document.createElement("div");
    cap.className = "lvlcap";
    const l = document.createElement("span");
    l.textContent = label;
    const v = document.createElement("span");
    v.className = "lvlval";
    cap.append(l, v);
    const track = document.createElement("div");
    track.className = "lvltrack";
    const fill = document.createElement("i");
    track.appendChild(fill);
    el.append(cap, track);
    function draw() {
      fill.style.width = (obj[key] / 99 * 100) + "%";
      v.textContent = obj[key];
    }
    draw();
    function setFromEvent(e) {
      const r = track.getBoundingClientRect();
      const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      obj[key] = Math.round(f * 99);
      draw();
    }
    track.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      track.setPointerCapture(e.pointerId);
      setFromEvent(e);
      function move(ev) { setFromEvent(ev); }
      function up() {
        track.removeEventListener("pointermove", move);
        track.removeEventListener("pointerup", up);
      }
      track.addEventListener("pointermove", move);
      track.addEventListener("pointerup", up);
    });
    return el;
  }

  function lfoSvg(wave) {
    let d = "M 4 31";
    const N = 232;
    for (let x = 0; x <= N; x++) {
      const p = x / N;
      const ph = (p * 2) % 1;
      let v;
      if (wave === "triangle") v = 1 - 4 * Math.abs(ph - 0.5);
      else if (wave === "saw") v = 1 - 2 * ph;
      else if (wave === "inverse saw") v = 2 * ph - 1;
      else if (wave === "square") v = ph < 0.5 ? 1 : -1;
      else if (wave === "random") v = Math.sin(x * 1.7) * Math.cos(x * 0.37);
      else v = Math.sin(p * Math.PI * 4);
      d += " L " + (4 + x) + " " + (31 - v * 22).toFixed(1);
    }
    return '<svg viewBox="0 0 240 62"><path d="' + d + '" fill="none" stroke="#3dff9e" stroke-width="1.4"/></svg>';
  }

    const p = activePart;
    const canPaste = clipboard && clipboard.kind === "part";
    const menu = document.createElement("div");
    menu.className = "part-menu";
    menu.innerHTML = '<div class="pm-head">part ' + p + ": " + PARTS[p - 1].name + "</div>" +
      '<button data-act="load">LOAD PART&hellip;</button>' +
      '<button data-act="save">SAVE PART&hellip;</button>' +
      '<button data-act="init">INIT PART</button>' +
      '<button data-act="copy">COPY PART</button>' +
      '<button data-act="paste"' + (canPaste ? "" : " disabled") + '>PASTE PART</button>';
    menu.addEventListener("click", function (e) {
      const b = e.target.closest("button");
      if (!b || b.disabled) return;
      closePartMenu();
      if (b.dataset.act === "load") openPartSlots("load");
      else if (b.dataset.act === "save") openPartSlots("save");
      else if (b.dataset.act === "init") openInitConfirm(p);
      else if (b.dataset.act === "copy") { copyPart(); toast("part copied"); }
      else if (b.dataset.act === "paste") { pastePart(p); toast("part pasted"); }
    });
    plugin.appendChild(menu);
    const r = btn.getBoundingClientRect();
    const pr = plugin.getBoundingClientRect();
    menu.style.left = (r.left - pr.left) + "px";
    menu.style.top = (r.bottom - pr.top + 4) + "px";
    partMenu = menu;
  }
  document.addEventListener("click", function (e) {
    if (partMenu && !e.target.closest(".part-menu") && !e.target.closest(".pmenu")) closePartMenu();
  });

  /* ---------------- dialogs ---------------- */
  function openDialog(title, bodyNode, buttons, wide) {
    const back = document.createElement("div");
    back.className = "backdrop";
    const dlg = document.createElement("div");
    dlg.className = "dialog" + (wide ? " wide" : "");
    const head = document.createElement("div");
    head.className = "dialog-head";
    head.innerHTML = "<span>" + title + '</span><span class="x">X</span>';
    const bodyEl = document.createElement("div");
    bodyEl.className = "dialog-body";
    bodyEl.appendChild(bodyNode);
    const foot = document.createElement("div");
    foot.className = "dialog-foot";
    buttons.forEach(function (bt) {
      const el = document.createElement("button");
      el.textContent = bt.label;
      if (bt.primary) el.className = "primary";
      el.addEventListener("click", function () { bt.onClick(close); });
      foot.appendChild(el);
    });
    dlg.append(head, bodyEl, foot);
    back.appendChild(dlg);
    head.querySelector(".x").addEventListener("click", function () { close(); });
    back.addEventListener("click", function (e) { if (e.target === back) close(); });
    document.body.appendChild(back);
    function close() { back.remove(); }
    return close;
  }

  function toast(msg) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1600);
  }

  /* ---------------- rename ---------------- */
  function openRename(title, currentName, onSave) {
    const bodyEl = document.createElement("div");
    const input = document.createElement("input");
    input.className = "textin";
    input.value = currentName;
    input.maxLength = 24;
    bodyEl.appendChild(input);
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = "max 24 characters.";
    bodyEl.appendChild(note);
    openDialog(title, bodyEl, [
      { label: "cancel", onClick: function (close) { close(); } },
      { label: "save", primary: true, onClick: function (close) {
        const v = input.value.trim();
        close();
        if (v) onSave(v);
      } }
    ]);
    setTimeout(function () { input.focus(); input.select(); }, 30);
  }

  function renamePart(i) {
    openRename("rename part", PARTS[i].name, function (v) {
      PARTS[i].name = v;
      buildToolbar();
      rerender();
      toast("part renamed");
    });
  }

  /* ---------------- part slots ---------------- */
  function partSnapshot(i) {
    const p = PARTS[i];
    return {
      name: p.name,
      part: { midi: p.midi, low: p.low, high: p.high, level: p.level, delay: p.delay },
      ops: JSON.parse(JSON.stringify(OPS)),
      voice: { mode: VOICE.mode, unison: VOICE.unison, detune: VOICE.detune, porta: VOICE.porta }
    };
  }

  function applyPartSnapshot(i, s) {
    const p = PARTS[i];
    p.name = s.name;
    p.midi = s.part.midi; p.low = s.part.low; p.high = s.part.high;
    p.level = s.part.level; p.delay = s.part.delay;
    s.ops.forEach(function (o, j) {
      const t = OPS[j];
      t.ratio = o.ratio; t.detune = o.detune; t.level = o.level; t.fb = o.fb;
      t.wave = o.wave; t.r = o.r.slice(); t.l = o.l.slice();
      t.lfoRate = o.lfoRate; t.lfoDepth = o.lfoDepth; t.lfoWave = o.lfoWave;
    });
    VOICE.mode = s.voice.mode; VOICE.unison = s.voice.unison;
    VOICE.detune = s.voice.detune; VOICE.porta = s.voice.porta;
    buildToolbar();
    rerender();
  }

  function openPartSlots(mode) {
    const partIdx = activePart - 1;
    let sel = -1;
    const first = mode === "load"
      ? PART_SLOTS.findIndex(function (s) { return s; })
      : 0;
    if (first >= 0) sel = first;
    const bodyEl = document.createElement("div");
    const list = document.createElement("div");
    list.className = "partlist";
    const cells = [];
    for (let i = 0; i < 8; i++) {
      const s = PART_SLOTS[i];
      const c = document.createElement("button");
      c.className = "slotrow" + (i === sel ? " sel" : "") + (mode === "load" && !s ? " dead" : "");
      c.innerHTML = '<span class="pno">' + String(i + 1).padStart(2, "0") + "</span>" +
        '<span class="sname">' + (s ? s.name : "empty") + "</span>";
      if (mode === "load" && !s) c.disabled = true;
      c.addEventListener("click", function () {
        sel = i;
        cells.forEach(function (x, j) { x.classList.toggle("sel", j === sel); });
      });
      list.appendChild(c);
      cells.push(c);
    }
    bodyEl.appendChild(list);
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = mode === "save"
      ? "pick a slot for " + PARTS[partIdx].name + ", then save."
      : "pick a stored part, then load.";
    bodyEl.appendChild(note);
    openDialog(mode === "save" ? "save part" : "load part", bodyEl, [
      { label: "cancel", onClick: function (close) { close(); } },
      { label: mode, primary: true, onClick: function (close) {
        if (sel < 0) return;
        close();
        if (mode === "save") savePartToSlot(sel);
        else loadPartFromSlot(sel);
      } }
    ]);
  }

  function savePartToSlot(idx) {
    const bodyEl = document.createElement("div");
    bodyEl.innerHTML = "Save <b>" + PARTS[activePart - 1].name + "</b> to part slot <b>" +
      String(idx + 1).padStart(2, "0") + "</b>?<br><span style='color:#9a9a9a'>This overwrites the slot.</span>";
    openDialog("confirm save", bodyEl, [
      { label: "cancel", onClick: function (close) { close(); } },
      { label: "save", primary: true, onClick: function (close) {
        close();
        PART_SLOTS[idx] = partSnapshot(activePart - 1);
        toast("part saved to slot " + String(idx + 1).padStart(2, "0"));
      } }
    ]);
  }

  function loadPartFromSlot(idx) {
    const s = PART_SLOTS[idx];
    if (!s) return;
    applyPartSnapshot(activePart - 1, s);
    toast("part loaded from slot " + String(idx + 1).padStart(2, "0"));
  }

  function openInitConfirm(p) {
    const bodyEl = document.createElement("div");
    bodyEl.innerHTML = "Initialise <b>" + PARTS[p - 1].name + "</b>?<br><span style='color:#9a9a9a'>" +
      "This clears the current part. Unsaved work will be lost.</span>";
    openDialog("init part", bodyEl, [
      { label: "cancel", onClick: function (close) { close(); } },
      { label: "continue", primary: true, onClick: function (close) {
        close();
        const t = PARTS[p - 1];
        t.midi = p; t.low = 0; t.high = 127; t.level = 99; t.delay = 0;
        buildToolbar();
        rerender();
        toast("part initialised");
      } }
    ]);
  }

  /* ---------------- patches ---------------- */
  const PATCHES = [
    { name: "init patch", tag: "default" },
    { name: "brass pad", tag: "part 1" },
    { name: "glass bell", tag: "part 1" },
    { name: "sub bass", tag: "part 1" },
    { name: "e.piano 84", tag: "part 1" },
    { name: "clang bell", tag: "part 2" },
    { name: "organ pad", tag: "part 2" },
    { name: "harsh lead", tag: "part 2" }
  ];
  const patchNameEl = document.getElementById("patchName");

  function showPatchName() {
    patchNameEl.textContent = PATCHES[loadedSlot].name;
  }

  document.getElementById("patchBtn").addEventListener("click", function () {
    let sel = loadedSlot;
    const bodyEl = document.createElement("div");
    const list = document.createElement("div");
    list.className = "patchlist";
    function render() {
      list.innerHTML = "";
      PATCHES.forEach(function (p, i) {
        const r = document.createElement("div");
        r.className = "preset-row" + (i === sel ? " sel" : "");
        r.innerHTML = '<span class="pno">' + String(i + 1).padStart(2, "0") + "</span>" +
          '<span class="pname">' + p.name + (i === loadedSlot ? '<span class="tag">active</span>' : "") + "</span>" +
          '<span class="meta">' + p.tag + "</span>";
        r.addEventListener("click", function () { sel = i; render(); });
        list.appendChild(r);
      });
    }
    render();
    bodyEl.appendChild(list);
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = "select a slot, then load or save. save writes the current patch into that slot.";
    bodyEl.appendChild(note);
    openDialog("patches", bodyEl, [
      { label: "cancel", onClick: function (close) { close(); } },
      { label: "save", onClick: function (close) { close(); openPatchSaveConfirm(sel); } },
      { label: "load", primary: true, onClick: function (close) {
        close();
        loadedSlot = sel;
        showPatchName();
        toast("loaded " + PATCHES[sel].name);
      } }
    ]);
  });

  function openPatchSaveConfirm(idx) {
    const pad = String(idx + 1).padStart(2, "0");
    const bodyEl = document.createElement("div");
    bodyEl.innerHTML = "Save <b>" + PATCHES[loadedSlot].name + "</b> to slot <b>" + pad +
      "</b>?<br><span style='color:#9a9a9a'>This overwrites the slot.</span>";
    openDialog("confirm save", bodyEl, [
      { label: "cancel", onClick: function (close) { close(); } },
      { label: "save", primary: true, onClick: function (close) {
        close();
        PATCHES[idx] = { name: PATCHES[loadedSlot].name, tag: "user" };
        loadedSlot = idx;
        showPatchName();
        toast("saved to slot " + pad);
      } }
    ]);
  }

  /* ---------------- init ---------------- */
  showPatchName();
  document.getElementById("patchRename").addEventListener("click", function () {
    openRename("rename patch", PATCHES[loadedSlot].name, function (v) {
      PATCHES[loadedSlot].name = v;
      showPatchName();
      toast("patch renamed");
    });
  });
  renderAlg();
  document.getElementById("algPick").addEventListener("click", openAlgPicker);
  if (!PART_SLOTS.some(Boolean)) PART_SLOTS[0] = partSnapshot(0);
  buildToolbar();
  tick();

  function fromHash() {
    const h = (location.hash || "").replace("#", "");
    if (h === "home") { showTab("patch"); return; }
    if (h === "presets") { showTab("patch"); document.getElementById("patchBtn").click(); return; }
    if (h === "save") { showTab("patch"); openPartSlots("save"); return; }
    if (h === "load") { showTab("patch"); openPartSlots("load"); return; }
    if (h === "init") { showTab("patch"); openInitConfirm(activePart); return; }
    if (h === "menu") { showTab("patch"); openPartMenu(document.querySelector(".pmenu")); return; }
    if (h === "alg") { showTab("patch"); openAlgPicker(); return; }
    if (h === "rename") { showTab("patch"); renamePart(0); return; }
    if (h === "fx" || h === "mod") { showTab("fxmod"); return; }
    if (TABS.some(function (x) { return x.id === h; })) showTab(h);
    else showTab("patch");
  }
  window.addEventListener("hashchange", fromHash);
  fromHash();

  /* Load the webfonts after the first paint so a slow or offline network never
     blocks the mockup. The local fallbacks cover the gap. */
  (function () {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Dots&display=swap";
    document.head.appendChild(link);
  })();
</script>
</body>
</html>
