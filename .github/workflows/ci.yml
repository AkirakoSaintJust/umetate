name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the pinned host image
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: umetate-host-build:latest
          cache-from: type=gha,scope=host
          cache-to: type=gha,mode=max,scope=host
      - name: Python gate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            umetate-host-build:latest \
            python3 -m umetate.deep_check --python --skill --links --roadmap

  plugin-linux-framework:
    # Framework test only. Product archives are built and attached to the
    # release in the type-p-fm1 repository, never here.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the pinned host image
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: umetate-host-build:latest
          cache-from: type=gha,scope=host
          cache-to: type=gha,mode=max,scope=host
      - name: Build and test the plugin
        run: |
          docker run --rm --shm-size=512m \
            -v "${{ github.workspace }}:/work" -w /work \
            umetate-host-build:latest \
            python3 -m umetate.cli plugin-build \
              --synth examples/type-p-fm1 \
              --out build/plugin/ci-linux --jobs 4

  plugin-windows-framework:
    # Framework test only. See the Linux job for the release boundary.
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_GENERATOR_PLATFORM: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python -m pip install -e .
      - name: Build the plugin
        run: >
          python -m umetate.cli plugin-build
          --synth examples/type-p-fm1
          --out build/plugin/ci-windows --jobs 4 --no-tests
      - name: Unit and host tests
        run: >
          ctest --test-dir build/plugin/ci-windows/build -C Release
          -E "linux_daws|plugin_editor_snapshot" --output-on-failure

  plugin-macos-framework:
    # The macOS build and AU target are still open. This job reports the state
    # without blocking the Linux and Windows gates, and it publishes nothing.
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: brew install cmake ninja
      - run: python -m pip install -e .
      - name: Build the plugin
        run: >
          python -m umetate.cli plugin-build
          --synth examples/type-p-fm1
          --out build/plugin/ci-macos --jobs 4 --no-tests
      - name: Unit and host tests
        run: >
          ctest --test-dir build/plugin/ci-macos/build -C Release
          -E "linux_daws|plugin_editor_snapshot" --output-on-failure
